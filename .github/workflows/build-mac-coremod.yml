name: Build macOS Forge coremod

on:
  push:
    branches:
      - mac-coremod-port
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Slinky macOS/Forge JAR
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Slinky-Mac-1.8.9
          path: build/mac/Slinky-Mac-1.8.9.jar
          if-no-files-found: error